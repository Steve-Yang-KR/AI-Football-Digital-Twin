name: Rename AI Command Center

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-command-center.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename sidebar menu
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '⌂ AI Command Center'
          new = '⌂ Overview'
          if old not in text:
              raise SystemExit(f'Expected text not found: {old}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename AI Command Center to Overview"
          git push
