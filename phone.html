<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Football Camera</title><style>:root{--bg:#f6f9fc;--panel:#fff;--ink:#10243e;--muted:#6f8096;--line:#dfe7f0;--blue:#0f7aff;--green:#34c759;--shadow:0 18px 45px rgba(40,76,120,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 12% 0,#eaf5ff,transparent 30%),var(--bg);color:var(--ink)}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:17px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#eaf7ef;color:#17813a;font-size:11px;font-weight:900}.session{font-size:12px;color:var(--muted)}video{width:100%;aspect-ratio:9/16;max-height:68vh;object-fit:cover;background:#0b1520;border-radius:20px;margin-top:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}select,button{font:inherit;padding:12px;border-radius:12px}select{border:1px solid var(--line);background:#fff}button{border:0;background:linear-gradient(90deg,var(--blue),#4b9cff);color:#fff;font-weight:900;cursor:pointer}.stop{background:#fff;color:var(--ink);border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{padding:11px;border:1px solid var(--line);border-radius:13px;background:#f9fbfd}.metric small,.metric b{display:block}.metric small{color:var(--muted);font-size:10px}.metric b{margin-top:3px}.notice{padding:12px;border-left:4px solid var(--blue);background:#edf6ff;border-radius:11px;color:#355777;margin-top:12px;font-size:12px;line-height:1.5}@media(max-width:520px){.controls,.metrics{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><span class="badge">AI Football Camera</span><h2 style="margin:8px 0 2px">Join capture session</h2><div class="session">Session: <b id="session">—</b></div></div><span id="state">Idle</span></div><video id="preview" autoplay muted playsinline></video><div class="controls"><select id="role"><option>LEFT</option><option>CENTER</option><option>RIGHT</option></select><select id="facing"><option value="environment">Rear camera</option><option value="user">Front camera</option></select><button id="start">Start camera</button><button class="stop" id="stop">Stop</button></div><div class="metrics"><div class="metric"><small>Role</small><b id="roleOut">LEFT</b></div><div class="metric"><small>Camera</small><b id="cameraOut">Off</b></div><div class="metric"><small>Connection</small><b>HTTPS</b></div></div><div class="notice"><b>Static demo:</b> This page can use the phone camera because GitHub Pages provides HTTPS. Returning the live video to the laptop dashboard requires the WebRTC signaling server.</div></div></div><script>const q=new URLSearchParams(location.search);session.textContent=q.get('session')||'DEMO';let stream=null;role.onchange=()=>roleOut.textContent=role.value;start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing.value},width:{ideal:1280},height:{ideal:720}},audio:false});preview.srcObject=stream;cameraOut.textContent='Live';state.textContent='Camera active';}catch(e){state.textContent='Permission blocked';alert('Camera access failed: '+e.message)}};stop.onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());preview.srcObject=null;cameraOut.textContent='Off';state.textContent='Stopped'};</script></body></html>
