<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Connect Phone Camera</title><style>:root{--bg:#07131f;--panel:#10243a;--ink:#f4f8fc;--muted:#9fb2c2;--blue:#3b91ff;--green:#31c77a;--line:#29435c;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131f,#0c1c2c);color:var(--ink);font-family:Inter,system-ui,Arial;min-height:100vh;padding:16px}.wrap{max-width:720px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px}.eyebrow{font-size:10px;font-weight:900;color:#72b5ff;letter-spacing:.12em}.code{font-size:27px;font-weight:950;letter-spacing:.15em;margin:7px 0}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.role{border:1px solid var(--line);background:#0b1c2d;color:var(--ink);padding:13px 7px;border-radius:11px;font-weight:900}.role.active{background:var(--blue);border-color:var(--blue)}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:13px;object-fit:cover}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.primary,.ghost{padding:13px;border-radius:11px;font-weight:900}.primary{border:0;background:var(--green);color:#062116}.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}.status{padding:11px;border-radius:11px;background:#0b1c2d;color:var(--muted);font-size:13px;line-height:1.45}.status.ok{color:#bdf6d5;border:1px solid rgba(49,199,122,.35)}.status.error{color:#ffd0d0;border:1px solid rgba(255,107,107,.35)}small{color:var(--muted);line-height:1.5;display:block}</style></head><body><div class="wrap"><div class="card"><div class="eyebrow">FOOTBALL DIGITAL TWIN CAMERA</div><div class="code">{{ code }}</div><small>Select this phone's position, start the rear camera and keep this page open. The stream is sent to the desktop through WebRTC.</small></div><div class="card"><div class="roles"><button class="role" data-role="LEFT">LEFT</button><button class="role active" data-role="CENTER">CENTER</button><button class="role" data-role="RIGHT">RIGHT</button></div></div><div class="card"><video id="preview" autoplay playsinline muted></video><div class="actions"><button class="primary" id="start">Start & Stream</button><button class="ghost" id="stop">Stop</button></div></div><div class="card"><div id="status" class="status">Waiting for camera permission.</div></div></div><script>
const code={{ code | tojson }};let role='CENTER',stream=null,heartbeat=null,pc=null,signal=null;const preview=document.getElementById('preview'),statusBox=document.getElementById('status');const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
document.querySelectorAll('.role').forEach(btn=>btn.onclick=()=>{if(stream){statusBox.className='status error';statusBox.textContent='Stop the camera before changing position.';return}document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));btn.classList.add('active');role=btn.dataset.role});
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/signal/${code}/${role}/phone`}
async function batteryLevel(){try{if(!navigator.getBattery)return null;const b=await navigator.getBattery();return Math.round(b.level*100)}catch{return null}}
async function report(connected){await fetch(`/api/sessions/${code}/camera`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,connected,battery:await batteryLevel(),fps:connected?30:0,latency:0,device:navigator.userAgent.slice(0,120)})})}
function openSignal(){return new Promise((resolve,reject)=>{signal=new WebSocket(wsUrl());signal.onopen=resolve;signal.onerror=reject;signal.onmessage=async e=>{const m=JSON.parse(e.data);if((m.type==='peer-ready'||m.type==='viewer-ready')&&stream)await createOffer();else if(m.type==='answer'&&pc)await pc.setRemoteDescription(m.sdp);else if(m.type==='candidate'&&pc){try{await pc.addIceCandidate(m.candidate)}catch(_){}}else if(m.type==='peer-left'){statusBox.className='status';statusBox.textContent=`${role} camera is on. Waiting for desktop viewer…`}}})}
async function createOffer(){if(!stream||!signal||signal.readyState!==1)return;if(pc)pc.close();pc=new RTCPeerConnection(ice);stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>{if(e.candidate&&signal.readyState===1)signal.send(JSON.stringify({type:'candidate',candidate:e.candidate}))};pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){statusBox.className='status ok';statusBox.textContent=`${role} video is LIVE on the desktop.`;signal.send(JSON.stringify({type:'streaming',value:true}))}else if(['failed','disconnected'].includes(pc.connectionState)){statusBox.className='status error';statusBox.textContent='Video connection interrupted. Waiting to reconnect…'}};const offer=await pc.createOffer();await pc.setLocalDescription(offer);signal.send(JSON.stringify({type:'offer',sdp:pc.localDescription}))}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:false});preview.srcObject=stream;await report(true);await openSignal();signal.send(JSON.stringify({type:'phone-ready'}));heartbeat=setInterval(()=>report(true).catch(()=>{}),5000);statusBox.className='status ok';statusBox.textContent=`${role} camera started. Waiting for desktop viewer…`}catch(err){statusBox.className='status error';statusBox.textContent=`Camera/connection failed: ${err.message}`}}
async function stopCamera(){clearInterval(heartbeat);if(signal?.readyState===1)signal.send(JSON.stringify({type:'streaming',value:false}));if(pc)pc.close();if(signal)signal.close();if(stream)stream.getTracks().forEach(t=>t.stop());pc=signal=stream=null;preview.srcObject=null;await report(false).catch(()=>{});statusBox.className='status';statusBox.textContent='Camera stopped.'}
start.onclick=startCamera;stop.onclick=stopCamera;window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script></body></html>
